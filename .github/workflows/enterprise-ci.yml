name: Enterprise CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'helm/**'
      - 'environments/**'
      - '.github/workflows/enterprise-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'helm/**'
      - 'environments/**'
      - '.github/workflows/enterprise-ci.yml'

jobs:

################################################################################
# Detect Changed Files
################################################################################

  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      helm: ${{ steps.filter.outputs.helm }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'terraform/**'

            helm:
              - 'helm/**'
              - 'environments/**'

################################################################################
# Terraform Validation
################################################################################

  terraform-validation:

    needs: detect-changes

    if: needs.detect-changes.outputs.terraform == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        environment:
          - dev
          - qa
          - prod

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verify Terraform Version
        run: terraform version

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Initialize
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

################################################################################
# Helm Validation
################################################################################

  helm-validation:

    needs:
      - detect-changes
      - terraform-validation

    if: |
      always() &&
      needs.detect-changes.outputs.helm == 'true' &&
      (
        needs.terraform-validation.result == 'success' ||
        needs.terraform-validation.result == 'skipped'
      )

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        environment:
          - dev
          - qa
          - prod

    env:
      CHART_PATH: ./helm/rajesh-web
      VALUES_FILE: ./environments/${{ matrix.environment }}/rajesh-web-values.yaml
      RELEASE_NAME: rajesh-${{ matrix.environment }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Verify Helm Installation
        run: helm version

      - name: Helm Lint
        run: helm lint $CHART_PATH

      - name: Helm Template
        run: |
          helm template $RELEASE_NAME \
            $CHART_PATH \
            -f $VALUES_FILE

################################################################################
# Terraform Security Scan
################################################################################

  terraform-security:

    needs:
      - terraform-validation

    if: |
      always() &&
      needs.terraform-validation.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform

################################################################################
# Package Helm Chart
################################################################################

  package-helm-chart:

    needs:
      - terraform-security

    if: |
      always() &&
      needs.terraform-security.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm Chart
        run: |
          mkdir -p package

          helm package ./helm/rajesh-web \
            --destination package

      - name: List Packaged Files
        run: |
          ls -lh package

################################################################################
# Final CI Gate
################################################################################

  ci-gate:

    needs:
      - terraform-validation
      - helm-validation
      - terraform-security
      - package-helm-chart

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Verify Enterprise CI Pipeline
        run: |

          echo "Terraform Validation : ${{ needs.terraform-validation.result }}"
          echo "Helm Validation      : ${{ needs.helm-validation.result }}"
          echo "Terraform Security   : ${{ needs.terraform-security.result }}"
          echo "Helm Package         : ${{ needs.package-helm-chart.result }}"

          if [[ "${{ needs.terraform-validation.result }}" == "failure" ]]; then
            echo "Terraform Validation Failed"
            exit 1
          fi

          if [[ "${{ needs.helm-validation.result }}" == "failure" ]]; then
            echo "Helm Validation Failed"
            exit 1
          fi

          if [[ "${{ needs.terraform-security.result }}" == "failure" ]]; then
            echo "Terraform Security Scan Failed"
            exit 1
          fi

          if [[ "${{ needs.package-helm-chart.result }}" == "failure" ]]; then
            echo "Helm Packaging Failed"
            exit 1
          fi

          echo "========================================"
          echo " Enterprise CI Pipeline Passed"
          echo "========================================"