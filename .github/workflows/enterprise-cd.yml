name: Enterprise CD Pipeline

on:
  workflow_run:
    workflows:
      - Enterprise CI Pipeline
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:

################################################################################
# Check Helm Artifact
################################################################################

  check-helm-artifact:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    outputs:
      helm_artifact: ${{ steps.check.outputs.helm_artifact }}

    steps:

      - name: Check Helm Artifact
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}

        run: |

          echo "Checking artifacts for CI Run ID: $RUN_ID"

          ARTIFACT_EXISTS=$(gh api \
            repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts \
            --jq '.artifacts[] | select(.name == "helm-chart") | .name')

          if [[ "$ARTIFACT_EXISTS" == "helm-chart" ]]; then

            echo "Helm artifact found."

            echo "helm_artifact=true" >> "$GITHUB_OUTPUT"

          else

            echo "Helm artifact not found."

            echo "helm_artifact=false" >> "$GITHUB_OUTPUT"

          fi

################################################################################
# DEV Deployment
################################################################################

  deploy-dev:

    needs:
      - check-helm-artifact

    if: |
      needs.check-helm-artifact.outputs.helm_artifact == 'true'

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Verify Helm Installation
        run: helm version

################################################################################
# Download Helm Artifact
################################################################################

      - name: Download Helm Package
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List Helm Package
        run: |
          echo "Downloaded Helm package:"
          ls -lh package

################################################################################
# Verify Helm Package
################################################################################

      - name: Verify Helm Package
        run: |
          test -n "$(find package -name '*.tgz' -print -quit)"
          echo "Helm package found successfully."

################################################################################
# DEV Deployment
################################################################################

      - name: Simulate DEV Deployment
        run: |
          echo "========================================"
          echo "        DEV DEPLOYMENT"
          echo "========================================"
          echo "Environment : dev"
          echo "Chart       : rajesh-web"
          echo "Artifact    : helm-chart"
          echo "CI Run ID   : ${{ github.event.workflow_run.id }}"
          echo "Status      : Deployment simulation"
          echo "========================================"