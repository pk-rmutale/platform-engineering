name: Enterprise CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'
      - 'environments/**'
      - '.github/workflows/enterprise-cd.yml'

jobs:

  deploy-dev:

    runs-on: ubuntu-latest

    environment:
      name: dev

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Verify Helm Installation
        run: helm version

      - name: Validate Helm Chart
        run: |
          helm lint ./helm/rajesh-web

      - name: Simulate DEV Deployment
        run: |
          echo "========================================"
          echo "        DEV DEPLOYMENT"
          echo "========================================"
          echo "Environment : dev"
          echo "Chart       : rajesh-web"
          echo "Status      : Deployment simulation"
          echo "========================================"